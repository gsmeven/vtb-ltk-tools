name: Build and Release Tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vtb-packer/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout vtb-ltk-tools
        uses: actions/checkout@v4

      # Step 1: Query GitHub REST API to detect relevant upstream/local changes
      - name: Check upstream commits
        id: check_upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            "Authorization" = "Bearer $env:GH_TOKEN"
            "User-Agent"    = "vtb-ltk-tools-ci"
          }

          $wadtools_sha = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/LeagueToolkit/wadtools/commits?sha=main&per_page=1")[0].sha.Substring(0, 8)
          $ritobin_sha  = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/LeagueToolkit/ritobin-tools/commits?sha=main&per_page=1")[0].sha.Substring(0, 8)
          $modproj_sha  = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/LeagueToolkit/league-mod/commits?path=crates/ltk_mod_project&sha=main&per_page=1")[0].sha.Substring(0, 8)
          $modpkg_sha   = (Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/LeagueToolkit/league-mod/commits?path=crates/ltk_modpkg&sha=main&per_page=1")[0].sha.Substring(0, 8)
          $packer_sha   = (git log -n 1 --format="%h" -- vtb-packer)

          $current_state = "wadtools:$wadtools_sha | ritobin_tools:$ritobin_sha | ltk_mod_project:$modproj_sha | ltk_modpkg:$modpkg_sha | vtb_packer:$packer_sha"
          Write-Host "Upstream/local state: $current_state"

          $repo = "${{ github.repository }}"
          $needs_build = $true
          try {
              $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/releases/tags/tools-latest"
              $force_events = @("workflow_dispatch", "push")
              if ($release.body -and $release.body.Contains($current_state) -and ($force_events -notcontains "${{ github.event_name }}")) {
                  Write-Host "No relevant changes detected. Skipping build."
                  $needs_build = $false
              }
          } catch {
              Write-Host "Initial release build or tag not found. Proceeding with build."
          }

          echo "needs_build=$needs_build" >> $env:GITHUB_OUTPUT
          echo "current_state=$current_state" >> $env:GITHUB_OUTPUT

      # Step 2: Install official stable Rust toolchain
      - name: Setup Rust
        if: steps.check_upstream.outputs.needs_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Step 3: Compile wadtools, ritobin-tools, and vtb-packer
      - name: Compile wadtools, ritobin-tools, and vtb-packer
        if: steps.check_upstream.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ./dist -Force | Out-Null

          cargo install --git https://github.com/LeagueToolkit/wadtools.git --locked --root ./dist
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile wadtools" }

          cargo install --git https://github.com/LeagueToolkit/ritobin-tools.git --locked --root ./dist
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile ritobin-tools" }

          cargo build --release --manifest-path ./vtb-packer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile vtb-packer" }

      # Step 4: Normalize binaries, verify presence & run smoke tests before packaging
      - name: Normalize, verify binaries and package
        if: steps.check_upstream.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path ./tools -Force | Out-Null

          $wadBin = Get-ChildItem ./dist/bin -Filter "*wad*.exe" | Select-Object -First 1
          $ritBin = Get-ChildItem ./dist/bin -Filter "*ritobin*.exe" | Select-Object -First 1
          $packerBin = Get-Item "./vtb-packer/target/release/vtb-packer.exe" -ErrorAction SilentlyContinue

          if (-not $wadBin -or -not $ritBin -or -not $packerBin) {
              throw "One or more compiled binaries were not found."
          }

          Move-Item -Path $wadBin.FullName -Destination "./tools/wadtools.exe" -Force
          Move-Item -Path $ritBin.FullName -Destination "./tools/ritobin.exe" -Force
          Move-Item -Path $packerBin.FullName -Destination "./tools/league-mod.exe" -Force

          foreach ($exe in @("./tools/wadtools.exe", "./tools/ritobin.exe", "./tools/league-mod.exe")) {
              if (-not (Test-Path $exe) -or (Get-Item $exe).Length -le 0) {
                  throw "Invalid binary: $exe"
              }
              & $exe --help | Out-Null
              if ($LASTEXITCODE -ne 0) {
                  throw "Smoke test failed for $exe"
              }
          }

          Compress-Archive -Path ./tools -DestinationPath ./tools.zip -Force

      # Step 5: Publish release tag
      - name: Publish Release
        if: steps.check_upstream.outputs.needs_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-latest
          name: "vtb-ltk-tools"
          body: "Compiled from upstream commits: ${{ steps.check_upstream.outputs.current_state }}"
          files: ./tools.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
