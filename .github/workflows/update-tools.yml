name: Build and Release Tools

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest

    steps:
      # Step 1: Query GitHub REST API to detect changes in upstream repositories
      - name: Check upstream commits for ritobin, wadtools, and league-mod
        id: check_upstream
        shell: pwsh
        run: |
          $wadtools_sha   = (Invoke-RestMethod -Uri "https://api.github.com/repos/LeagueToolkit/wadtools/commits?sha=main&per_page=1")[0].sha.Substring(0, 8)
          $ritobin_sha    = (Invoke-RestMethod -Uri "https://api.github.com/repos/LeagueToolkit/ritobin-tools/commits?sha=main&per_page=1")[0].sha.Substring(0, 8)
          $league_mod_sha = (Invoke-RestMethod -Uri "https://api.github.com/repos/LeagueToolkit/league-mod/commits?sha=main&per_page=1")[0].sha.Substring(0, 8)
          $ltk_ritobin_sha = (Invoke-RestMethod -Uri "https://api.github.com/repos/LeagueToolkit/league-toolkit/commits?path=crates/ltk_ritobin&sha=main&per_page=1")[0].sha.Substring(0, 8)
          $ltk_wad_sha     = (Invoke-RestMethod -Uri "https://api.github.com/repos/LeagueToolkit/league-toolkit/commits?path=crates/ltk_wad&sha=main&per_page=1")[0].sha.Substring(0, 8)

          # Combine commit SHAs into a unified fingerprint
          $current_state = "wadtools:$wadtools_sha | ritobin_tools:$ritobin_sha | league_mod:$league_mod_sha | ltk_ritobin:$ltk_ritobin_sha | ltk_wad:$ltk_wad_sha"
          Write-Host "Upstream parser state: $current_state"

          # Idempotency check: Skip build if current release already matches this state
          $repo = "${{ github.repository }}"
          $needs_build = $true
          try {
              $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/tools-latest"
              if ($release.body -and $release.body.Contains($current_state) -and "${{ github.event_name }}" -ne "workflow_dispatch") {
                  Write-Host "No relevant upstream changes detected. Skipping build."
                  $needs_build = $false
              }
          } catch {
              Write-Host "Initial release build or tag not found. Proceeding with build."
          }

          echo "needs_build=$needs_build" >> $env:GITHUB_OUTPUT
          echo "current_state=$current_state" >> $env:GITHUB_OUTPUT

      # Step 2: Install official stable Rust toolchain
      - name: Setup Rust
        if: steps.check_upstream.outputs.needs_build == 'true'
        uses: dtolnay/rust-toolchain@stable

      # Step 3: Fetch source code from Git and compile release binaries via Cargo
      - name: Compile wadtools, ritobin, and league-mod
        if: steps.check_upstream.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          mkdir dist -Force
          cargo install --git https://github.com/LeagueToolkit/wadtools.git --root ./dist
          cargo install --git https://github.com/LeagueToolkit/ritobin-tools.git --root ./dist
          cargo install --git https://github.com/LeagueToolkit/league-mod.git --root ./dist

      # Step 4: Move binaries into a 'tools' directory and package into tools.zip
      - name: Normalize binaries and package
        if: steps.check_upstream.outputs.needs_build == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./tools -Force

          Get-ChildItem ./dist/bin | Where-Object { $_.Name -like "*wad*" } | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "./tools/wadtools.exe" -Force
          }
          Get-ChildItem ./dist/bin | Where-Object { $_.Name -like "*ritobin*" } | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "./tools/ritobin.exe" -Force
          }
          Get-ChildItem ./dist/bin | Where-Object { $_.Name -like "*league-mod*" } | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "./tools/league-mod.exe" -Force
          }

          Compress-Archive -Path ./tools -DestinationPath ./tools.zip -Force

      # Step 5: Publish release tag
      - name: Publish Release
        if: steps.check_upstream.outputs.needs_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tools-latest
          name: "vtb-ltk-tools"
          body: "Compiled from upstream parser commits: ${{ steps.check_upstream.outputs.current_state }}"
          files: ./tools.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
